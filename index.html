<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Generic Airline — Seat Assistant</title>
<!--
  ============================================================================
  AI-FIRST SEAT ASSISTANT  ->  NCC (Thrio) ESCALATION
  ============================================================================
  The page owns the conversation. Claude handles self-service against a tool
  layer; NCC is loaded only when the conversation needs a human.

  Everything is driven by URL query params so one hosted page serves every
  scenario. See README.md for the full list. Quick reference:

    ?pnr=JX4K2P&flight=NX482&from=PHX&to=JFK&date=2026-10-04
    &name=Jordan%20Marquez&tier=Gold
    &debug=1              show the NCC payload inspector
    &ai=live&proxy=URL    use the real Claude API through your proxy
    &handoff=iframe       embed the NCC survey directly instead of the widget

  Four seams are marked with banner comments below:
    [SEAM 1] BOOKING + SEAT DATA   - replace with your inventory API
    [SEAM 2] TOOL LAYER            - replace mock implementations with real calls
    [SEAM 3] AI ENGINE             - mock brain vs. live Claude via proxy
    [SEAM 4] NCC HANDOFF           - the escalation payload and launch
  ============================================================================
-->
<style>
  :root {
    --brand:#003087; --brand-2:#0050C8; --brand-soft:#EEF4FF;
    --ink:#1a2332; --muted:#5b6b7f; --line:#e0e6ed; --bg:#f4f6fa;
    --ok:#1e7e34; --ok-soft:#D4EDDA; --warn:#B26A00; --warn-soft:#FFF3CD;
    --ai:#5B3FA8; --ai-soft:#F1ECFB;
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  html,body { font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    background:var(--bg); color:var(--ink); font-size:13px; }
  body { min-height:100vh; }

  /* ---------- top bar ---------- */
  .topbar { background:linear-gradient(135deg,var(--brand) 0%,var(--brand-2) 100%); color:#fff; padding:12px 18px; }
  .topbar-inner { max-width:1120px; margin:0 auto; display:flex; align-items:center; gap:14px; flex-wrap:wrap; }
  .topbar h1 { font-size:16px; font-weight:700; letter-spacing:-0.01em; }
  .flightstrip { display:flex; gap:8px; flex-wrap:wrap; margin-left:auto; }
  .chip { background:rgba(255,255,255,0.15); border:1px solid rgba(255,255,255,0.25);
    border-radius:20px; padding:3px 10px; font-size:11px; font-weight:600; white-space:nowrap; }
  .chip b { font-weight:700; font-family:'SF Mono','Courier New',monospace; letter-spacing:0.03em; }

  /* ---------- mobile tabs ---------- */
  .tabs { display:none; max-width:1120px; margin:10px auto 0; padding:0 14px; gap:6px; }
  .tabs button { flex:1; padding:9px; border:1px solid var(--line); background:#fff; color:var(--muted);
    font-size:12px; font-weight:700; border-radius:8px; cursor:pointer; position:relative; }
  .tabs button.active { background:var(--brand); color:#fff; border-color:var(--brand); }
  .tabs button .dot { position:absolute; top:6px; right:10px; width:7px; height:7px; border-radius:50%;
    background:#E53935; display:none; }
  .tabs button .dot.on { display:block; }

  /* ---------- layout ---------- */
  .layout { max-width:1120px; margin:0 auto; padding:14px; display:grid;
    grid-template-columns:minmax(0,420px) minmax(0,1fr); gap:14px; align-items:start; }
  .panel { background:#fff; border:1px solid var(--line); border-radius:12px; overflow:hidden; }
  .panel-head { padding:10px 14px; border-bottom:1px solid var(--line); display:flex;
    align-items:center; gap:8px; }
  .panel-head h2 { font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:0.07em; color:var(--muted); }
  .panel-body { padding:12px 14px; }

  /* ---------- seat map ---------- */
  .seatstatus { margin:0 0 10px; border-radius:8px; padding:9px 12px; text-align:center;
    background:var(--brand-soft); border:2px solid var(--brand); transition:all .2s ease; }
  .seatstatus.assigned { background:var(--ok-soft); border-color:var(--ok); }
  .seatstatus .lbl { font-size:9px; font-weight:700; text-transform:uppercase; letter-spacing:0.1em; color:var(--muted); }
  .seatstatus .val { font-size:21px; font-weight:700; color:var(--brand);
    font-family:'SF Mono','Courier New',monospace; letter-spacing:0.05em; line-height:1.25; }
  .seatstatus.assigned .val { color:var(--ok); }
  .seatstatus .sub { font-size:11px; color:var(--muted); }

  .legend { display:flex; gap:7px; flex-wrap:wrap; justify-content:center; margin-bottom:9px; }
  .legend-item { display:flex; align-items:center; gap:4px; font-size:9.5px; font-weight:600; color:var(--muted); }
  .sw { width:11px; height:11px; border-radius:2px; border:1px solid; }

  .nose { text-align:center; font-size:9px; font-weight:700; color:var(--brand); padding:4px 0;
    letter-spacing:0.15em; border-bottom:1px dashed var(--line); margin-bottom:6px; }
  .cabin { margin-bottom:7px; }
  .cabin-header { font-size:9.5px; font-weight:700; text-transform:uppercase; letter-spacing:0.06em;
    margin-bottom:4px; padding-bottom:3px; border-bottom:1px dashed #ccd4e0; }
  .col-headers { display:flex; gap:2px; justify-content:center; margin-bottom:3px; padding-left:20px; }
  .col-headers span { width:26px; font-size:9px; font-weight:700; color:#9aa7b5; text-align:center; }
  .col-headers .gap { width:12px; }
  .row { display:flex; gap:2px; justify-content:center; align-items:center; margin-bottom:2px; }
  .row-num { width:20px; font-size:9px; font-weight:700; color:#9aa7b5; text-align:right; padding-right:3px; }
  .row .gap { width:12px; }
  .seat { width:26px; height:26px; border-radius:3px; border:1px solid; display:flex; align-items:center;
    justify-content:center; font-size:9px; font-weight:700; cursor:pointer; transition:transform .1s ease;
    flex-shrink:0; user-select:none; padding:0; font-family:inherit; }
  .seat:hover:not(:disabled) { transform:scale(1.15); box-shadow:0 2px 6px rgba(0,0,0,.2); z-index:5; }
  .seat:focus-visible { outline:2px solid var(--brand); outline-offset:1px; z-index:6; }
  .seat.fc { background:#F3E5F5; border-color:#9C27B0; color:#4A148C; }
  .seat.xl { background:#E3F2FD; border-color:#2196F3; color:#0D47A1; }
  .seat.ex { background:#FFF3CD; border-color:#FFC107; color:#795548; }
  .seat.av { background:#E8F5E9; border-color:#4CAF50; color:#2E7D32; }
  .seat.taken { background:#dde2e8; border-color:#c3ccd6; color:#9aa7b5; cursor:not-allowed; }
  .seat.mine { background:#fff; border:2px dashed var(--brand); color:var(--brand); }
  .seat.selected { background:var(--brand); border-color:var(--brand); color:#fff;
    transform:scale(1.18); box-shadow:0 3px 8px rgba(0,48,135,.45); }
  .seat.suggested { animation:pulse 1.4s ease-in-out infinite; box-shadow:0 0 0 2px rgba(91,63,168,.55); }
  @keyframes pulse { 0%,100%{box-shadow:0 0 0 2px rgba(91,63,168,.55);} 50%{box-shadow:0 0 0 5px rgba(91,63,168,.15);} }
  .maplock { font-size:10px; color:var(--muted); text-align:center; margin-top:8px; font-style:italic; }

  /* ---------- chat ---------- */
  .chat-panel { display:flex; flex-direction:column; min-height:560px; }
  .ai-badge { background:var(--ai-soft); color:var(--ai); font-size:9.5px; font-weight:700;
    padding:2px 7px; border-radius:10px; text-transform:uppercase; letter-spacing:0.06em; }
  .agent-badge { background:var(--ok-soft); color:var(--ok); font-size:9.5px; font-weight:700;
    padding:2px 7px; border-radius:10px; text-transform:uppercase; letter-spacing:0.06em; }
  .msgs { flex:1; overflow-y:auto; padding:14px; display:flex; flex-direction:column; gap:10px;
    max-height:60vh; scroll-behavior:smooth; }
  /* column flex items shrink once the list overflows - that squashes cards to slivers */
  .msgs > * { flex-shrink:0; }
  .msg { display:flex; gap:8px; max-width:88%; }
  .msg.user { align-self:flex-end; flex-direction:row-reverse; }
  .avatar { width:24px; height:24px; border-radius:50%; flex-shrink:0; display:flex; align-items:center;
    justify-content:center; font-size:11px; font-weight:700; }
  .msg.ai .avatar { background:var(--ai-soft); color:var(--ai); }
  .msg.user .avatar { background:var(--brand-soft); color:var(--brand); }
  .bubble { padding:9px 12px; border-radius:12px; line-height:1.5; font-size:12.5px; }
  .msg.ai .bubble { background:#f2f4f8; border-bottom-left-radius:3px; }
  .msg.user .bubble { background:var(--brand); color:#fff; border-bottom-right-radius:3px; }
  .msg.system { align-self:center; max-width:100%; }
  .msg.system .bubble { background:var(--warn-soft); color:var(--warn); font-size:11px;
    text-align:center; border-radius:8px; font-weight:600; }

  .thinking { display:flex; gap:4px; padding:10px 12px; }
  .thinking span { width:6px; height:6px; border-radius:50%; background:#b9c2cd; animation:bounce 1.2s infinite; }
  .thinking span:nth-child(2){animation-delay:.15s} .thinking span:nth-child(3){animation-delay:.3s}
  @keyframes bounce { 0%,60%,100%{transform:translateY(0);opacity:.5} 30%{transform:translateY(-4px);opacity:1} }

  .toolcall { align-self:flex-start; font-size:10px; color:var(--muted); font-family:'SF Mono','Courier New',monospace;
    background:#f7f8fa; border:1px dashed var(--line); border-radius:6px; padding:4px 8px; max-width:88%; }
  .toolcall b { color:var(--ai); font-weight:700; }

  /* ---------- cards (adaptive-card style) ---------- */
  .card { border:1px solid var(--line); border-radius:10px; overflow:hidden; background:#fff; max-width:88%;
    align-self:flex-start; box-shadow:0 1px 3px rgba(16,24,40,.06); }
  .card-head { padding:8px 12px; background:#fafbfc; border-bottom:1px solid var(--line);
    font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:0.07em; color:var(--muted); }
  .card-body { padding:10px 12px; }
  .opt { display:flex; align-items:center; gap:10px; padding:8px; border:1px solid var(--line);
    border-radius:8px; margin-bottom:7px; }
  .opt:last-child { margin-bottom:0; }
  .opt-seat { font-family:'SF Mono','Courier New',monospace; font-size:16px; font-weight:700;
    color:var(--brand); min-width:42px; text-align:center; }
  .opt-info { flex:1; min-width:0; }
  .opt-info .t { font-weight:700; font-size:12px; }
  .opt-info .d { font-size:10.5px; color:var(--muted); margin-top:1px; }
  .opt-price { font-size:12px; font-weight:700; white-space:nowrap; }
  .opt-price.free { color:var(--ok); }
  .btn { border:none; border-radius:7px; padding:7px 12px; font-size:11.5px; font-weight:700;
    cursor:pointer; font-family:inherit; white-space:nowrap; }
  .btn-primary { background:var(--brand); color:#fff; }
  .btn-primary:hover { background:var(--brand-2); }
  .btn-ok { background:var(--ok); color:#fff; }
  .btn-ghost { background:#fff; color:var(--brand); border:1px solid var(--brand); }
  .btn:disabled { opacity:.55; cursor:not-allowed; }
  .btn-wide { width:100%; padding:10px; font-size:13px; margin-top:8px; }
  .kv { display:flex; justify-content:space-between; gap:14px; padding:4px 0; font-size:12px; border-bottom:1px dashed #eef1f5; }
  .kv:last-child { border-bottom:none; }
  .kv .k { color:var(--muted); }
  .kv .v { font-weight:700; }
  .kv.total { border-top:1px solid var(--line); margin-top:4px; padding-top:7px; border-bottom:none; }
  .card.escalate { border-color:var(--warn); }
  .card.escalate .card-head { background:var(--warn-soft); color:var(--warn); }
  .handoff-list { font-size:11px; color:var(--muted); line-height:1.7; margin:6px 0 0; padding-left:16px; }
  .handoff-list code { font-family:'SF Mono','Courier New',monospace; font-size:10px; color:var(--ai); }

  /* ---------- composer ---------- */
  .quickies { display:flex; gap:6px; flex-wrap:wrap; padding:0 14px 8px; }
  .quickies button { background:#fff; border:1px solid var(--brand); color:var(--brand); font-size:11px;
    font-weight:600; padding:5px 10px; border-radius:14px; cursor:pointer; font-family:inherit; }
  .quickies button:hover { background:var(--brand-soft); }
  .composer { border-top:1px solid var(--line); padding:10px 14px; display:flex; gap:8px; }
  .composer input { flex:1; border:1px solid var(--line); border-radius:8px; padding:9px 12px;
    font-size:12.5px; font-family:inherit; }
  .composer input:focus { outline:none; border-color:var(--brand); }

  /* ---------- NCC mount ---------- */
  #nccHost { position:fixed; bottom:16px; right:16px; width:380px; height:560px; max-width:calc(100vw - 32px);
    max-height:calc(100vh - 32px); z-index:2147483000; display:none; border-radius:12px; overflow:hidden;
    box-shadow:0 12px 40px rgba(16,24,40,.28); background:#fff; border:1px solid var(--line); }
  #nccHost.on { display:block; }
  #nccHost .ncc-bar { height:34px; background:var(--brand); color:#fff; display:flex; align-items:center;
    justify-content:space-between; padding:0 12px; font-size:11.5px; font-weight:700; }
  #nccHost .ncc-bar button { background:none; border:none; color:#fff; font-size:16px; cursor:pointer; line-height:1; }
  #nccHost iframe { width:100%; height:calc(100% - 34px); border:none; display:block; }

  /* ---------- debug ---------- */
  #debug { position:fixed; left:0; right:0; bottom:0; background:#0f1720; color:#d6e0ea; z-index:2147483100;
    font-family:'SF Mono','Courier New',monospace; font-size:11px; display:none; max-height:44vh; }
  #debug.on { display:flex; flex-direction:column; }
  #debug .dbg-tabs { display:flex; border-bottom:1px solid #26333f; flex-shrink:0; }
  #debug .dbg-tabs button { background:none; border:none; color:#7f8ea0; padding:7px 14px; cursor:pointer;
    font-family:inherit; font-size:11px; font-weight:700; }
  #debug .dbg-tabs button.active { color:#6ee7b7; border-bottom:2px solid #6ee7b7; }
  #debug .dbg-tabs .spacer { margin-left:auto; display:flex; align-items:center; gap:10px; padding-right:12px; }
  #debug .size { font-size:10px; color:#7f8ea0; }
  #debug .size.warn { color:#fbbf24; }
  #debug pre { margin:0; padding:12px; overflow:auto; flex:1; line-height:1.55; white-space:pre-wrap;
    word-break:break-word; }
  .dbg-toggle { position:fixed; right:14px; bottom:14px; z-index:2147483099; background:#0f1720; color:#6ee7b7;
               border:none; border-radius:18px; padding:7px 13px; font-size:11px; font-weight:700; cursor:pointer;
    font-family:'SF Mono','Courier New',monospace; display:none; box-shadow:0 3px 10px rgba(0,0,0,.25); }
  .dbg-toggle.on { display:block; }
  /* keep the inspector from covering the composer it is meant to explain */
  body.debug-open { padding-bottom:46vh; }

  @media (max-width:880px) {
    .layout { grid-template-columns:1fr; }
    .tabs { display:flex; }
    .layout.tab-seats .chat-panel { display:none; }
    .layout.tab-chat .seatmap-panel { display:none; }
    .flightstrip { margin-left:0; width:100%; }
    #nccHost { width:calc(100vw - 20px); height:calc(100vh - 20px); bottom:10px; right:10px; }
  }
</style>
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <h1>&#9992;&#65039; Generic Airline</h1>
    <div class="flightstrip" id="flightStrip"></div>
  </div>
</header>

<div class="tabs" id="tabs">
  <button data-tab="seats" class="active">Seat Map</button>
  <button data-tab="chat">Assistant<span class="dot" id="chatDot"></span></button>
</div>

<main class="layout tab-seats" id="layout">

  <section class="panel seatmap-panel">
    <div class="panel-head"><h2>Cabin &amp; Seat Map</h2></div>
    <div class="panel-body">
      <div class="seatstatus" id="seatStatus">
        <div class="lbl">Your seat</div>
        <div class="val" id="seatVal">&mdash;</div>
        <div class="sub" id="seatSub">&nbsp;</div>
      </div>
      <div class="legend">
        <div class="legend-item"><div class="sw" style="background:#F3E5F5;border-color:#9C27B0"></div>First</div>
        <div class="legend-item"><div class="sw" style="background:#E3F2FD;border-color:#2196F3"></div>Legroom</div>
        <div class="legend-item"><div class="sw" style="background:#FFF3CD;border-color:#FFC107"></div>Exit</div>
        <div class="legend-item"><div class="sw" style="background:#E8F5E9;border-color:#4CAF50"></div>Economy</div>
        <div class="legend-item"><div class="sw" style="background:#dde2e8;border-color:#c3ccd6"></div>Taken</div>
      </div>
      <div class="nose">&#9650; FRONT OF AIRCRAFT</div>
      <div id="seatMap"></div>
      <div class="maplock" id="mapLock"></div>
    </div>
  </section>

  <section class="panel chat-panel">
    <div class="panel-head">
      <h2 id="chatTitle">Travel Assistant</h2>
      <span class="ai-badge" id="chatBadge">AI &middot; Self-service</span>
    </div>
    <div class="msgs" id="msgs"></div>
    <div class="quickies" id="quickies"></div>
    <form class="composer" id="composer" autocomplete="off">
      <input id="input" placeholder="Ask about seats, bags, upgrades&hellip;" aria-label="Message">
      <button class="btn btn-primary" type="submit">Send</button>
    </form>
  </section>

</main>

<div id="nccHost">
  <div class="ncc-bar"><span>Live Agent &mdash; Generic Airline</span><button id="nccClose" aria-label="Close">&times;</button></div>
  <iframe id="nccFrame" title="NCC Live Chat" allow="fullscreen"></iframe>
</div>

<button class="dbg-toggle" id="dbgToggle">&#9679; NCC payload</button>
<div id="debug">
  <div class="dbg-tabs">
    <button data-d="ctx" class="active">Context &rarr; NCC</button>
    <button data-d="tools">Tool calls</button>
    <button data-d="tx">Transcript</button>
    <div class="spacer">
      <span class="size" id="dbgSize"></span>
      <button data-d="close" style="color:#f87171">close</button>
    </div>
  </div>
  <pre id="dbgOut"></pre>
</div>

<script>
"use strict";

/* ===========================================================================
   [SEAM 1]  BOOKING + SEAT DATA
   ---------------------------------------------------------------------------
   Today: booking comes from URL params, inventory is a static map.
   To go live: replace CONFIG defaults with a booking lookup, and replace
   SEAT_INVENTORY with a fetch() of your availability service.
   =========================================================================== */

const qs = new URLSearchParams(location.search);
const param = (k, d) => (qs.get(k) || d);

const BOOKING = {
  pnr:        param('pnr', 'JX4K2P'),
  flight:     param('flight', 'NX482'),
  origin:     param('from', 'PHX'),
  destination:param('to', 'JFK'),
  date:       param('date', '2026-10-04'),
  name:       param('name', 'Jordan Marquez'),
  email:      param('email', ''),
  tier:       param('tier', 'Gold'),
  fareClass:  param('fare', 'Main Cabin'),
  currentSeat:param('seat', '18E')
};

const CONFIG = {
  aiMode:   param('ai', 'mock'),                 // 'mock' | 'live'
  proxyUrl: param('proxy', ''),                  // your serverless proxy endpoint
  model:    param('model', 'claude-opus-5'),
  handoff:  param('handoff', 'widget'),          // 'widget' | 'iframe'
  debug:    qs.get('debug') === '1',
  ncc: {
    protocol:  'https',
    host:      param('host', 'astonvilla.thrio.io'),
    tenantId:  param('tenant', 'nextivase11'),
    campaignId:param('campaign', '67f55aa7312c5d6534ab530d'),
    trace:     true
  }
};

// Cabin bands. `price` is the change fee shown to the customer.
const CABINS = [
  { type:'fc', name:'First Class',     label:'First Class',           rows:[1,2,3,4],             price:189, pitch:'38"' },
  { type:'xl', name:'Extra Legroom',   label:'Extra Legroom · +$45', rows:[5,6],             price:45,  pitch:'34"' },
  { type:'av', name:'Economy',         label:'Economy · +$15',   rows:[7,8,9,10,11,12,13],   price:15,  pitch:'31"' },
  { type:'ex', name:'Exit Row',        label:'Exit Row · +$40',  rows:[14,15],               price:40,  pitch:'36"' },
  { type:'av', name:'Economy',         label:'Economy · +$15',   rows:[16,17,18,19,20],      price:15,  pitch:'31"' }
];

const COLS = ['A','B','C','D','E','F'];
const OCCUPIED = { 1:['B','E'],2:['A','F'],3:['C'],4:['D','E'],5:['A','B'],6:['F'],7:['C','D'],
  8:['A'],9:['B','E','F'],10:['D'],11:['A','C'],12:['B','F'],13:['E'],14:['A'],15:['C','D'],
  16:['B'],17:['A','F'],18:['C','E'],19:['D'],20:['B','C','F'] };

function buildInventory() {
  const seats = {};
  CABINS.forEach(cab => cab.rows.forEach(row => COLS.forEach(col => {
    const code = row + col;
    const exitRow = cab.type === 'ex';
    seats[code] = {
      code, row, col, cabin:cab.type, cabinName:cab.name, price:cab.price, pitch:cab.pitch,
      window: col === 'A' || col === 'F',
      aisle:  col === 'C' || col === 'D',
      middle: col === 'B' || col === 'E',
      exitRow,
      extraLegroom: cab.type === 'xl' || exitRow || cab.type === 'fc',
      noRecline: row === 13 || row === 20,
      nearLav: row >= 19,
      occupied: (OCCUPIED[row] || []).includes(col)
    };
  })));
  return seats;
}
const SEAT_INVENTORY = buildInventory();

function seatTraits(s) {
  const t = [];
  if (s.window) t.push('Window'); else if (s.aisle) t.push('Aisle'); else t.push('Middle');
  if (s.exitRow) t.push('Exit row');
  else if (s.extraLegroom && s.cabin !== 'fc') t.push('Extra legroom');
  if (s.cabin === 'fc') t.push('Lie-flat');
  if (s.noRecline) t.push('No recline');
  if (s.nearLav) t.push('Near lavatory');
  return t;
}

/* ===========================================================================
   APPLICATION STATE
   =========================================================================== */

const STORE_KEY = 'ga.seat.' + BOOKING.pnr;

const state = {
  assignedSeat: BOOKING.currentSeat,   // what the booking currently holds
  pendingSeat:  null,                  // highlighted / proposed, not yet assigned
  suggested:    [],                    // seats the AI is pointing at
  escalated:    false,                 // NCC has been engaged
  turns:        0,
  unresolved:   0,                     // consecutive turns with no progress
  transcript:   [],                    // {role, text} for the handoff summary
  toolLog:      [],
  messages:     [],                    // Claude-format history (live mode)
  lastPayload:  null
};

try {
  const saved = JSON.parse(localStorage.getItem(STORE_KEY) || 'null');
  if (saved && SEAT_INVENTORY[saved.assignedSeat]) state.assignedSeat = saved.assignedSeat;
} catch (_) { /* storage unavailable - fall back to the booking's seat */ }

function persist() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify({ assignedSeat: state.assignedSeat })); }
  catch (_) { /* private mode - selection simply won't survive reload */ }
}

/* ===========================================================================
   [SEAM 2]  TOOL LAYER
   ---------------------------------------------------------------------------
   These schemas are sent verbatim to Claude in live mode. Each `run` is the
   mock implementation - swap the body for a real API call and nothing else
   in the app has to change. A tool returns:
       { result: <JSON the model sees>, card: <optional UI card> }
   =========================================================================== */

const TOOLS = [
  {
    name:'get_booking',
    description:'Look up the current reservation: passenger, flight, fare class, loyalty tier, and currently assigned seat.',
    input_schema:{ type:'object', properties:{}, required:[] },
    run() {
      const s = SEAT_INVENTORY[state.assignedSeat];
      return { result:{
        pnr:BOOKING.pnr, passenger:BOOKING.name, flight:BOOKING.flight,
        route:BOOKING.origin + '-' + BOOKING.destination, date:BOOKING.date,
        fareClass:BOOKING.fareClass, loyaltyTier:BOOKING.tier,
        assignedSeat:state.assignedSeat,
        assignedSeatTraits: s ? seatTraits(s) : []
      }};
    }
  },
  {
    name:'search_seats',
    description:'Find available seats matching a preference. Use this before recommending anything so you never offer a seat that is taken.',
    input_schema:{ type:'object', properties:{
      preference:{ type:'string', enum:['window','aisle','extra_legroom','exit_row','first_class','any'],
        description:'What the customer is looking for' },
      max_price:{ type:'number', description:'Maximum change fee in USD the customer will pay' },
      count:{ type:'number', description:'How many options to return (default 3)' }
    }, required:['preference'] },
    run(input) {
      const pref = input.preference || 'any';
      const max = typeof input.max_price === 'number' ? input.max_price : Infinity;
      const count = Math.min(input.count || 3, 5);
      let pool = Object.values(SEAT_INVENTORY)
        .filter(s => !s.occupied && s.code !== state.assignedSeat && s.price <= max);

      if (pref === 'window')            pool = pool.filter(s => s.window);
      else if (pref === 'aisle')        pool = pool.filter(s => s.aisle);
      else if (pref === 'extra_legroom')pool = pool.filter(s => s.extraLegroom);
      else if (pref === 'exit_row')     pool = pool.filter(s => s.exitRow);
      else if (pref === 'first_class')  pool = pool.filter(s => s.cabin === 'fc');

      pool.sort((a,b) => (a.price - b.price) || (a.row - b.row));
      const picks = pool.slice(0, count);

      state.suggested = picks.map(s => s.code);
      renderMap();

      return {
        result:{ matches:picks.length, seats:picks.map(s => ({
          seat:s.code, cabin:s.cabinName, changeFee:s.price, pitch:s.pitch, traits:seatTraits(s)
        }))},
        card: picks.length ? { kind:'options', seats:picks } : null
      };
    }
  },
  {
    name:'get_seat_details',
    description:'Get full detail on one specific seat, including whether it is available.',
    input_schema:{ type:'object', properties:{
      seat:{ type:'string', description:'Seat code such as 14C' } }, required:['seat'] },
    run(input) {
      const s = SEAT_INVENTORY[String(input.seat || '').toUpperCase()];
      if (!s) return { result:{ error:'No such seat on this aircraft.' } };
      return { result:{ seat:s.code, available:!s.occupied, cabin:s.cabinName,
        changeFee:s.price, pitch:s.pitch, traits:seatTraits(s) } };
    }
  },
  {
    name:'price_seat_change',
    description:'Price a move from the currently assigned seat to a target seat. Always call this before asking the customer to confirm.',
    input_schema:{ type:'object', properties:{
      to_seat:{ type:'string', description:'Target seat code' } }, required:['to_seat'] },
    run(input) {
      const to = SEAT_INVENTORY[String(input.to_seat || '').toUpperCase()];
      if (!to) return { result:{ error:'Unknown seat.' } };
      if (to.occupied) return { result:{ error:'That seat is no longer available.' } };
      // Loyalty waiver - the kind of rule worth demonstrating.
      const waiver = (BOOKING.tier === 'Gold' || BOOKING.tier === 'Platinum') && to.price <= 45;
      const total = waiver ? 0 : to.price;
      state.pendingSeat = to.code;
      renderMap();
      return {
        result:{ from:state.assignedSeat, to:to.code, baseFee:to.price,
          loyaltyWaiver:waiver, waiverReason: waiver ? BOOKING.tier + ' member - seat fees waived up to $45' : null,
          total, currency:'USD' },
        card:{ kind:'price', to, baseFee:to.price, waiver, total }
      };
    }
  },
  {
    name:'assign_seat',
    description:'Commit the seat change on the reservation. Only call after the customer has explicitly agreed to the price.',
    input_schema:{ type:'object', properties:{
      seat:{ type:'string', description:'Seat code to assign' } }, required:['seat'] },
    run(input) {
      const to = SEAT_INVENTORY[String(input.seat || '').toUpperCase()];
      if (!to || to.occupied) return { result:{ error:'Seat unavailable.' } };
      const prev = state.assignedSeat;
      if (SEAT_INVENTORY[prev]) SEAT_INVENTORY[prev].occupied = false;
      to.occupied = false;
      state.assignedSeat = to.code;
      state.pendingSeat = null;
      state.suggested = [];
      state.unresolved = 0;
      persist(); renderMap(); renderStatus();
      return {
        result:{ ok:true, previousSeat:prev, assignedSeat:to.code, confirmation:BOOKING.pnr + '-' + to.code },
        card:{ kind:'confirmed', seat:to, prev }
      };
    }
  },
  {
    name:'get_policy',
    description:'Look up airline policy. Use for factual questions rather than guessing.',
    input_schema:{ type:'object', properties:{
      topic:{ type:'string', enum:['baggage','seat_change','exit_row_eligibility','boarding','pets','wifi'] }
    }, required:['topic'] },
    run(input) {
      const P = {
        baggage:{ title:'Checked baggage',
          body:'First bag $35, second $45. ' + BOOKING.tier + ' members receive two free checked bags. Carry-on plus one personal item is always included.' },
        seat_change:{ title:'Seat changes',
          body:'Seats may be changed free of charge up to 24 hours before departure; inside 24 hours a change fee applies. Fees are waived for Gold and Platinum members on seats up to $45.' },
        exit_row_eligibility:{ title:'Exit row seating',
          body:'Passengers must be 15 or older, physically able to assist in an evacuation, and willing to do so. Exit rows cannot be assigned to travellers with infants or requiring assistance.' },
        boarding:{ title:'Boarding',
          body:'Boarding opens 40 minutes before departure. ' + BOOKING.tier + ' members board in Group 2.' },
        pets:{ title:'Travelling with pets',
          body:'One carrier per passenger in cabin, $125 each way, must fit under the seat in front. Not permitted in exit rows or the first row of any cabin.' },
        wifi:{ title:'Wi-Fi',
          body:'Free messaging for all passengers. Full browsing $8 per flight, complimentary in First Class.' }
      };
      const p = P[input.topic];
      if (!p) return { result:{ error:'No policy on file for that topic.' } };
      return { result:p, card:{ kind:'policy', title:p.title, body:p.body } };
    }
  },
  {
    name:'escalate_to_agent',
    description:'Hand the conversation to a live human agent. Use ONLY when the request genuinely cannot be completed with the other tools - refunds, compensation, medical or accessibility needs, complaints, disruptions, or an explicit request for a person. Do not escalate a question you can answer.',
    input_schema:{ type:'object', properties:{
      reason:{ type:'string', description:'Short machine-readable reason, e.g. refund_request, accessibility, explicit_request' },
      summary:{ type:'string', description:'Two or three sentences the agent should read before saying hello' },
      urgency:{ type:'string', enum:['normal','high'] }
    }, required:['reason','summary'] },
    run(input) {
      const payload = buildNccContext(input.reason, input.summary, input.urgency || 'normal');
      state.lastPayload = payload;
      refreshDebug();
      return {
        result:{ ok:true, staged:true, note:'Escalation card shown. The customer must press Connect - do not assume an agent is present yet.' },
        card:{ kind:'escalate', reason:input.reason, summary:input.summary, payload }
      };
    }
  }
];

const TOOL_BY_NAME = Object.fromEntries(TOOLS.map(t => [t.name, t]));
const TOOL_SCHEMAS = TOOLS.map(({ name, description, input_schema }) => ({ name, description, input_schema }));

function runTool(name, input) {
  const tool = TOOL_BY_NAME[name];
  if (!tool) return { result:{ error:'Unknown tool ' + name } };
  let out;
  try { out = tool.run(input || {}); }
  catch (err) { out = { result:{ error:String(err && err.message || err) } }; }
  state.toolLog.push({ at:new Date().toISOString(), name, input, result:out.result });
  refreshDebug();
  return out;
}

/* ===========================================================================
   [SEAM 3]  AI ENGINE
   ---------------------------------------------------------------------------
   mock : deterministic intent matcher. No key, no network, demo-safe.
   live : real Claude via your serverless proxy. Same tools, same UI - the
          only difference is who decides which tool to call.
   =========================================================================== */

const SYSTEM_PROMPT = [
  'You are the travel assistant for Generic Airline, embedded in the seat-selection page.',
  'The customer is ' + BOOKING.name + ' (' + BOOKING.tier + '), booking ' + BOOKING.pnr + ', flight ' + BOOKING.flight +
    ' ' + BOOKING.origin + '-' + BOOKING.destination + ' on ' + BOOKING.date + '.',
  '',
  'Rules:',
  '- Resolve the request yourself whenever the tools allow it. You are the first and usually the only line of support.',
  '- Never state a seat, price, or policy you have not obtained from a tool. Do not guess availability.',
  '- Call price_seat_change before asking anyone to confirm, and assign_seat only after they agree.',
  '- Keep replies to two or three short sentences. The UI renders the details as cards, so do not repeat lists in prose.',
  '- Escalate only when the request is genuinely outside the tools: refunds, compensation, accessibility or medical needs,',
  '  complaints, irregular operations, or a direct request for a human. A question you can answer is not an escalation.',
  '- When you do escalate, write the summary for the agent, not for the customer.'
].join('\n');

/* --- live mode: manual tool-use loop against the proxy ------------------- */

async function callProxy(body) {
  const res = await fetch(CONFIG.proxyUrl, {
    method:'POST', headers:{ 'Content-Type':'application/json' }, body:JSON.stringify(body)
  });
  if (!res.ok) throw new Error('Proxy returned ' + res.status + ': ' + (await res.text()).slice(0, 200));
  return res.json();
}

async function liveTurn(userText) {
  state.messages.push({ role:'user', content:userText });
  const cards = [];
  let text = '';

  for (let i = 0; i < 8; i++) {
        const reply = await callProxy({
      model: CONFIG.model,
      max_tokens: 2048,
      output_config: { effort: 'low' },   // chat latency matters more than depth here
      system: SYSTEM_PROMPT,
      tools: TOOL_SCHEMAS,
      messages: state.messages
    });

    state.messages.push({ role:'assistant', content:reply.content });

    const toolUses = (reply.content || []).filter(b => b.type === 'tool_use');
    text = (reply.content || []).filter(b => b.type === 'text').map(b => b.text).join('\n').trim();

    if (reply.stop_reason !== 'tool_use' || !toolUses.length) break;

    if (text) renderMessage('ai', text);
    const results = [];
    for (const use of toolUses) {
      renderToolCall(use.name, use.input);
      const out = runTool(use.name, use.input);
      if (out.card) cards.push(out.card);
      results.push({ type:'tool_result', tool_use_id:use.id, content:JSON.stringify(out.result) });
    }
    state.messages.push({ role:'user', content:results });
    text = '';
  }
  return { text, cards };
}

/* --- mock mode: scripted intent engine ---------------------------------- */

const MATCH = (t, ...words) => words.some(w => t.includes(w));

function mockTurn(userText) {
  const t = userText.toLowerCase();
  const seq = [];
  const say = s => seq.push({ type:'text', text:s });
  const call = (name, input) => seq.push({ type:'tool', name, input });

  const seatMention = (userText.toUpperCase().match(/\b(\d{1,2})\s?([A-F])\b/) || [])[0];

  // --- escalation intents: things the tools genuinely cannot do ---
  if (MATCH(t,'refund','money back','compensat','reimburse')) {
    say("Refunds are handled by our service team rather than from here — let me bring someone in with your booking already open.");
    call('escalate_to_agent', { reason:'refund_request', urgency:'normal',
      summary:'Customer is requesting a refund on ' + BOOKING.pnr + ' (' + BOOKING.flight + ' ' + BOOKING.origin + '-' + BOOKING.destination +
        '). Not actionable through self-service. Seat currently ' + state.assignedSeat + '. No fare rules reviewed yet.' });
    return seq;
  }
  if (MATCH(t,'wheelchair','disabilit','accessib','medical','oxygen','assistance animal','service animal')) {
    say("Accessibility requests need a person to review them properly — I don't want to get this wrong. Connecting you now.");
    call('escalate_to_agent', { reason:'accessibility', urgency:'high',
      summary:'Customer raised an accessibility/medical requirement on ' + BOOKING.pnr + '. Requires human review and may affect seat eligibility (exit rows excluded). Currently in ' + state.assignedSeat + '.' });
    return seq;
  }
  if (MATCH(t,'agent','human','person','representative','someone real','speak to a')) {
    say("Of course — connecting you to an agent. Everything we've covered goes across with you.");
    call('escalate_to_agent', { reason:'explicit_request', urgency:'normal',
      summary:'Customer explicitly asked for a human agent. Self-service context: seat ' + state.assignedSeat +
        ', ' + state.turns + ' prior turns with the assistant. See transcript for detail.' });
    return seq;
  }
  if (MATCH(t,'complain','terrible','awful','unacceptable','ridiculous','worst')) {
    say("I'm sorry — that's not the experience we want. Let me get you to someone who can actually make it right.");
    call('escalate_to_agent', { reason:'complaint', urgency:'high',
      summary:'Customer expressed strong dissatisfaction. Recommend a service-recovery review. Booking ' + BOOKING.pnr + ', seat ' + state.assignedSeat + '.' });
    return seq;
  }

  // --- confirm / accept ---
  if (state.pendingSeat && MATCH(t,'yes','yep','confirm','book it','do it','take it','sounds good','please do','go ahead','sure')) {
    call('assign_seat', { seat:state.pendingSeat });
    say("Done — you're all set. Your boarding pass will refresh automatically.");
    return seq;
  }

  // --- a specific seat named ---
  if (seatMention) {
    const code = seatMention.replace(/\s/g,'').toUpperCase();
    call('get_seat_details', { seat:code });
    const s = SEAT_INVENTORY[code];
    if (!s)             say("I can't find " + code + " on this aircraft — it's a 20-row layout, so rows go up to 20.");
    else if (s.occupied)say(code + " is already taken, unfortunately. Tell me what you liked about it and I'll find the closest match.");
    else { call('price_seat_change', { to_seat:code }); say("Here's what " + code + " would cost. Want me to lock it in?"); }
    return seq;
  }

  // --- seat search intents ---
  if (MATCH(t,'window'))        { call('search_seats',{preference:'window',count:3});        say("Here are the best windows still open. Tap one and I'll price it."); return seq; }
  if (MATCH(t,'aisle'))         { call('search_seats',{preference:'aisle',count:3});         say("These aisles are available. Any of them work?"); return seq; }
  if (MATCH(t,'exit row','exit')){ call('search_seats',{preference:'exit_row',count:3});     say("Exit rows have the most room in the cabin. Worth noting there's an eligibility check at the gate."); return seq; }
  if (MATCH(t,'legroom','leg room','tall','more room','stretch','knee')) {
    call('search_seats',{preference:'extra_legroom',count:3});
    say("These give you the most space. Exit rows are the roomiest at 36 inches of pitch."); return seq;
  }
  if (MATCH(t,'first class','upgrade','business')) {
    call('search_seats',{preference:'first_class',count:3});
    say("First Class is open on this flight. As a " + BOOKING.tier + " member you'd also get priority boarding and two free bags."); return seq;
  }
  if (MATCH(t,'middle','stuck','cramped','bad seat','change my seat','move seat','different seat','switch seat','change seat')) {
    call('get_booking', {});
    call('search_seats',{preference:'aisle',count:3});
    say("You're in " + state.assignedSeat + " right now — a middle seat near the back. Here are three better options."); return seq;
  }

  // --- policy intents ---
  if (MATCH(t,'bag','luggage','suitcase','checked')) { call('get_policy',{topic:'baggage'}); return seq; }
  if (MATCH(t,'pet','dog','cat'))                    { call('get_policy',{topic:'pets'}); return seq; }
  if (MATCH(t,'wifi','wi-fi','internet'))            { call('get_policy',{topic:'wifi'}); return seq; }
  if (MATCH(t,'board','group','zone'))               { call('get_policy',{topic:'boarding'}); return seq; }
  if (MATCH(t,'fee','cost','charge','how much','price') && !seatMention) {
    call('get_policy',{topic:'seat_change'});
    say("As a " + BOOKING.tier + " member most seat changes are free for you. Want me to find something better than " + state.assignedSeat + "?");
    return seq;
  }
  if (MATCH(t,'hello','hi ','hey','good morning','good afternoon')) {
    say("Hi " + BOOKING.name.split(' ')[0] + " — I can move your seat, quote an upgrade, or answer questions about " + BOOKING.flight + ". What do you need?");
    return seq;
  }

  // --- nothing matched ---
  state.unresolved++;
  if (state.unresolved >= 2) {
    say("I don't think I'm getting you what you need. Let me hand this to an agent rather than keep guessing.");
    call('escalate_to_agent', { reason:'unresolved_after_attempts', urgency:'normal',
      summary:'Assistant could not resolve the request after ' + state.unresolved + ' attempts. Last message: "' +
        userText.slice(0,140) + '". Booking ' + BOOKING.pnr + ', seat ' + state.assignedSeat + '.' });
    return seq;
  }
  say("I can help with seats, upgrades, bags, boarding and Wi-Fi on " + BOOKING.flight + ". Could you say a bit more about what you're after?");
  return seq;
}

async function runMock(userText) {
  const seq = mockTurn(userText);
  const cards = [];
  let text = '';
  for (const step of seq) {
    if (step.type === 'text') { text = step.text; continue; }
    renderToolCall(step.name, step.input);
    await sleep(420);
    const out = runTool(step.name, step.input);
    if (out.card) cards.push(out.card);
  }
  return { text, cards };
}

/* ===========================================================================
   [SEAM 4]  NCC HANDOFF
   ---------------------------------------------------------------------------
   Verified against thriowidgets-1.2.1.js: the widget builds
     {protocol}://{host}/survey/?tenant=..&campaignId=..&trace=..&context=<urlencoded JSON>
   Context travels in the QUERY STRING. Two consequences drive the code below:
     1. It is size-limited. Never put a transcript in it - send an id.
     2. It is visible and editable by the customer. Never put anything
        trust-bearing (price, entitlement, fare authority) in it. Re-derive
        money server-side from the PNR.
   Every key here is readable in the agent's survey as ${workitem.data?.<key>}
   =========================================================================== */

function buildNccContext(reason, summary, urgency) {
  const s = SEAT_INVENTORY[state.assignedSeat] || {};
  const transcriptId = 'tx-' + BOOKING.pnr + '-' + Date.now().toString(36);

  // Values are stringified: a numeric 0 can read as empty in survey conditionals.
  return {
    // --- booking identity: what the agent needs to find the customer ---
    pnr:              BOOKING.pnr,
    passengerName:    BOOKING.name,
    passengerEmail:   BOOKING.email,
    loyaltyTier:      BOOKING.tier,
    flightNumber:     BOOKING.flight,
    route:            BOOKING.origin + '-' + BOOKING.destination,
    departureDate:    BOOKING.date,

    // --- seat state ---
    seatSummary:      state.assignedSeat + ' · ' + (s.cabinName || '') + ' · ' + seatTraits(s).join(', '),
    selectedSeat:     String(state.assignedSeat),
    selectedCabin:    String(s.cabin || ''),
    selectedCabinName:String(s.cabinName || ''),
    selectedSeatRow:  String(s.row || ''),
    selectedSeatColumn:String(s.col || ''),

    // --- what the AI already did: the reason this handoff is warm ---
    aiHandled:        'true',
    aiTurns:          String(state.turns),
    aiToolCalls:      String(state.toolLog.length),
    escalationReason: reason,
    escalationUrgency:urgency,
    aiSummary:        summary,
    transcriptId:     transcriptId,

    // --- routing ---
    routingHint:      s.cabin === 'fc' ? 'premium' : (urgency === 'high' ? 'priority' : 'standard')
  };
}

function nccSurveyUrl(context) {
  const c = CONFIG.ncc;
  return c.protocol + '://' + c.host + '/survey/?tenant=' + encodeURIComponent(c.tenantId) +
    '&campaignId=' + encodeURIComponent(c.campaignId) + '&trace=' + c.trace +
    '&context=' + encodeURIComponent(JSON.stringify(context));
}

let nccLoaded = false;

function launchNcc(context) {
  if (nccLoaded) return;
  nccLoaded = true;
    state.escalated = true;

  const url = nccSurveyUrl(context);
  if (url.length > 4000) {
    console.warn('[NCC] context URL is ' + url.length + ' chars - trim fields before this reaches production.');
  }

  if (CONFIG.handoff === 'iframe') {
    // Direct embed: we control size, placement and chrome. Same destination.
    document.getElementById('nccFrame').src = url;
    document.getElementById('nccHost').classList.add('on');
  } else {
    // Official widget: set params first, then load - the bundle reads
    // window.thrioParams on the window 'load' event.
    window.thrioParams = {
      protocol: CONFIG.ncc.protocol, host: CONFIG.ncc.host,
      tenantId: CONFIG.ncc.tenantId, campaignId: CONFIG.ncc.campaignId,
      trace: CONFIG.ncc.trace,
      colors: { buttonColor:'#ffffff', buttonBackground:'#003087' },
      properties: { showHeader:true, showCloseButton:true, showMinimizeButton:true },
      context
    };
    const script = document.createElement('script');
    script.type = 'module';
    script.src = 'https://storage.googleapis.com/thrio-public-prod-files/thriowidgets-1.2.1.js';
    script.onerror = () => renderMessage('system', 'Live chat failed to load. Please call 1-800-555-0142.');
    document.head.appendChild(script);
  }

  document.getElementById('chatBadge').textContent = 'Live agent';
  document.getElementById('chatBadge').className = 'agent-badge';
  document.getElementById('chatTitle').textContent = 'Connected to an agent';
  renderMessage('system', 'Transferred to a live agent — your seat details and this conversation went with you.');
  renderMap();
}

document.getElementById('nccClose').addEventListener('click', () => {
  document.getElementById('nccHost').classList.remove('on');
});

/* ===========================================================================
   RENDERING
   =========================================================================== */

const msgsEl = document.getElementById('msgs');
const sleep = ms => new Promise(r => setTimeout(r, ms));

function scrollDown() { msgsEl.scrollTop = msgsEl.scrollHeight; }

function renderMessage(role, text) {
  const wrap = document.createElement('div');
  wrap.className = 'msg ' + role;
  if (role === 'system') {
    wrap.innerHTML = '<div class="bubble"></div>';
    wrap.querySelector('.bubble').textContent = text;
  } else {
    const who = role === 'ai' ? 'AI' : (BOOKING.name[0] || 'Y');
    wrap.innerHTML = '<div class="avatar"></div><div class="bubble"></div>';
    wrap.querySelector('.avatar').textContent = who;
    wrap.querySelector('.bubble').textContent = text;
  }
  msgsEl.appendChild(wrap);
  scrollDown();
  if (role !== 'user') state.transcript.push({ role, text });
  if (role === 'ai') flagUnread();
}

function renderToolCall(name, input) {
  const el = document.createElement('div');
  el.className = 'toolcall';
  const args = Object.entries(input || {}).map(([k,v]) => k + ': ' + JSON.stringify(v)).join(', ');
  el.innerHTML = '&#9881; calling <b></b>(<span></span>)';
  el.querySelector('b').textContent = name;
  el.querySelector('span').textContent = args;
  msgsEl.appendChild(el);
  scrollDown();
}

function showThinking() {
  const el = document.createElement('div');
  el.className = 'msg ai'; el.id = 'thinkingRow';
  el.innerHTML = '<div class="avatar">AI</div><div class="bubble thinking"><span></span><span></span><span></span></div>';
  msgsEl.appendChild(el); scrollDown();
}
function hideThinking() { const el = document.getElementById('thinkingRow'); if (el) el.remove(); }

function card(kind, headText, bodyNode) {
  const el = document.createElement('div');
  el.className = 'card' + (kind === 'escalate' ? ' escalate' : '');
  const head = document.createElement('div');
  head.className = 'card-head'; head.textContent = headText;
  const body = document.createElement('div');
  body.className = 'card-body'; body.appendChild(bodyNode);
  el.appendChild(head); el.appendChild(body);
  msgsEl.appendChild(el); scrollDown();
  return el;
}

function renderCard(c) {
  if (!c) return;

  if (c.kind === 'options') {
    const box = document.createElement('div');
    c.seats.forEach(s => {
      const row = document.createElement('div');
      row.className = 'opt';
      row.innerHTML =
        '<div class="opt-seat"></div>' +
        '<div class="opt-info"><div class="t"></div><div class="d"></div></div>' +
        '<div class="opt-price"></div>' +
        '<button class="btn btn-primary">Select</button>';
      row.querySelector('.opt-seat').textContent = s.code;
      row.querySelector('.t').textContent = s.cabinName;
      row.querySelector('.d').textContent = seatTraits(s).join(' · ') + ' · ' + s.pitch + ' pitch';
      const free = (BOOKING.tier === 'Gold' || BOOKING.tier === 'Platinum') && s.price <= 45;
      const price = row.querySelector('.opt-price');
      price.textContent = free ? 'Free' : '$' + s.price;
      if (free) price.classList.add('free');
      row.querySelector('button').addEventListener('click', () => send('I’ll take ' + s.code));
      box.appendChild(row);
    });
    card('options', 'Available seats', box);
    return;
  }

  if (c.kind === 'price') {
    const box = document.createElement('div');
    const rows = [
      ['Moving to', c.to.code + ' · ' + c.to.cabinName],
      ['Seat fee', '$' + c.baseFee]
    ];
    if (c.waiver) rows.push([BOOKING.tier + ' waiver', '− $' + c.baseFee]);
    box.innerHTML = rows.map(([k,v]) =>
      '<div class="kv"><span class="k">' + k + '</span><span class="v">' + v + '</span></div>').join('') +
      '<div class="kv total"><span class="k">Total due</span><span class="v">' +
      (c.total === 0 ? 'No charge' : '$' + c.total) + '</span></div>';
    const btn = document.createElement('button');
    btn.className = 'btn btn-ok btn-wide';
    btn.textContent = 'Confirm ' + c.to.code;
    btn.addEventListener('click', () => send('Yes, confirm ' + c.to.code));
    box.appendChild(btn);
    card('price', 'Seat change quote', box);
    return;
  }

  if (c.kind === 'confirmed') {
    const box = document.createElement('div');
    box.innerHTML =
      '<div class="kv"><span class="k">Previous seat</span><span class="v">' + c.prev + '</span></div>' +
      '<div class="kv"><span class="k">New seat</span><span class="v">' + c.seat.code + '</span></div>' +
      '<div class="kv"><span class="k">Cabin</span><span class="v">' + c.seat.cabinName + '</span></div>' +
      '<div class="kv total"><span class="k">Confirmation</span><span class="v">' + BOOKING.pnr + '-' + c.seat.code + '</span></div>';
    card('confirmed', '✓ Seat confirmed', box);
    return;
  }

  if (c.kind === 'policy') {
    const box = document.createElement('div');
    box.style.cssText = 'font-size:12px;line-height:1.6';
    box.textContent = c.body;
    card('policy', c.title, box);
    return;
  }

  if (c.kind === 'escalate') {
    const box = document.createElement('div');
    const p = document.createElement('div');
    p.style.cssText = 'font-size:12px;line-height:1.55;margin-bottom:4px';
    p.textContent = c.summary;
    const note = document.createElement('div');
    note.style.cssText = 'font-size:10.5px;color:#5b6b7f;margin-top:8px;font-weight:700';
    note.textContent = 'The agent will already have:';
    const ul = document.createElement('ul');
    ul.className = 'handoff-list';
    ul.innerHTML =
      '<li>Booking <code>' + c.payload.pnr + '</code> &mdash; ' + c.payload.passengerName + ' (' + c.payload.loyaltyTier + ')</li>' +
      '<li>Seat <code>' + c.payload.seatSummary + '</code></li>' +
      '<li>Reason <code>' + c.payload.escalationReason + '</code> &middot; routing <code>' + c.payload.routingHint + '</code></li>' +
      '<li>' + c.payload.aiTurns + ' turns of context, transcript <code>' + c.payload.transcriptId + '</code></li>';
    const btn = document.createElement('button');
    btn.className = 'btn btn-primary btn-wide';
    btn.textContent = 'Connect me to an agent →';
    btn.addEventListener('click', () => {
      btn.disabled = true; btn.textContent = 'Connecting…';
      launchNcc(c.payload);
    });
    box.appendChild(p); box.appendChild(note); box.appendChild(ul); box.appendChild(btn);
    card('escalate', 'Handing off to a person', box);
    return;
  }
}

/* --- seat map --- */

function renderMap() {
  const map = document.getElementById('seatMap');
  map.innerHTML = '';
  CABINS.forEach((cab, idx) => {
    const wrap = document.createElement('div');
    wrap.className = 'cabin';
    const h = document.createElement('div');
    h.className = 'cabin-header';
    h.style.color = { fc:'#9C27B0', xl:'#2196F3', ex:'#795548', av:'#2E7D32' }[cab.type];
    h.textContent = cab.label;
    wrap.appendChild(h);

    if (idx === 0) {
      const ch = document.createElement('div');
      ch.className = 'col-headers';
      ch.innerHTML = '<span>A</span><span>B</span><span>C</span><span class="gap"></span><span>D</span><span>E</span><span>F</span>';
            wrap.appendChild(ch);
    }

    cab.rows.forEach(rowNum => {
      const row = document.createElement('div');
      row.className = 'row';
      const rn = document.createElement('span');
      rn.className = 'row-num'; rn.textContent = rowNum;
      row.appendChild(rn);

      COLS.forEach((col, ci) => {
        const s = SEAT_INVENTORY[rowNum + col];
        const btn = document.createElement('button');
        btn.type = 'button';
        const isMine = s.code === state.assignedSeat;
        const classes = ['seat', s.cabin];
        if (isMine) classes.push('mine');
        else if (s.occupied) classes.push('taken');
        if (s.code === state.pendingSeat) classes.push('selected');
        if (state.suggested.includes(s.code)) classes.push('suggested');
        btn.className = classes.join(' ');
        btn.textContent = isMine ? '★' : (s.occupied ? '✕' : col);
        btn.title = s.code + (isMine ? ' (your seat)' : '') + ' — ' + seatTraits(s).join(', ');
        btn.setAttribute('aria-label', 'Seat ' + s.code + ', ' + (s.occupied && !isMine ? 'unavailable' : seatTraits(s).join(', ')));
        btn.disabled = (s.occupied && !isMine) || state.escalated;
        if (!btn.disabled && !isMine) btn.addEventListener('click', () => send('Tell me about ' + s.code));
        row.appendChild(btn);
        if (ci === 2) { const g = document.createElement('span'); g.className = 'gap'; row.appendChild(g); }
      });
      wrap.appendChild(row);
    });
    map.appendChild(wrap);
  });

  document.getElementById('mapLock').textContent = state.escalated
    ? 'Seat map locked — ask your agent to make further changes.'
    : 'Tap any open seat, or just ask the assistant.';
}

function renderStatus() {
  const s = SEAT_INVENTORY[state.assignedSeat];
  const box = document.getElementById('seatStatus');
  document.getElementById('seatVal').textContent = state.assignedSeat;
  document.getElementById('seatSub').textContent = s ? (s.cabinName + ' · ' + seatTraits(s).join(' · ')) : '';
  box.classList.toggle('assigned', state.assignedSeat !== BOOKING.currentSeat);
}

function renderFlightStrip() {
  const strip = document.getElementById('flightStrip');
  [['PNR', BOOKING.pnr], ['Flight', BOOKING.flight],
   ['', BOOKING.origin + ' → ' + BOOKING.destination], ['', BOOKING.date],
   ['', BOOKING.name + ' · ' + BOOKING.tier]].forEach(([k, v]) => {
    const c = document.createElement('div');
    c.className = 'chip';
    c.innerHTML = (k ? k + ' ' : '') + '<b></b>';
    c.querySelector('b').textContent = v;
    strip.appendChild(c);
  });
}

/* --- quick replies --- */

const QUICK = ['I’m stuck in a middle seat', 'Any window seats?', 'How much for extra legroom?',
  'What’s the baggage allowance?', 'I need a refund'];

function renderQuickies() {
  const box = document.getElementById('quickies');
  box.innerHTML = '';
  if (state.escalated) return;
  QUICK.forEach(q => {
    const b = document.createElement('button');
    b.type = 'button'; b.textContent = q;
    b.addEventListener('click', () => send(q));
    box.appendChild(b);
  });
}

/* --- mobile tabs --- */

function flagUnread() {
  if (document.getElementById('layout').classList.contains('tab-chat')) return;
  document.getElementById('chatDot').classList.add('on');
}
document.getElementById('tabs').addEventListener('click', e => {
  const b = e.target.closest('button[data-tab]');
  if (!b) return;
  document.querySelectorAll('#tabs button').forEach(x => x.classList.remove('active'));
  b.classList.add('active');
  const layout = document.getElementById('layout');
  layout.className = 'layout tab-' + b.dataset.tab;
  if (b.dataset.tab === 'chat') document.getElementById('chatDot').classList.remove('on');
});

/* ===========================================================================
   CONVERSATION LOOP
   =========================================================================== */

let busy = false;

async function send(text) {
  if (busy || !text.trim()) return;
  if (state.escalated) {
    renderMessage('system', 'You are with a live agent now — use the agent chat window.');
    return;
  }
  busy = true;
  state.turns++;
  renderMessage('user', text);
  state.transcript.push({ role:'user', text });
  document.getElementById('input').value = '';
  showThinking();

  try {
    const { text: reply, cards } =
      CONFIG.aiMode === 'live' && CONFIG.proxyUrl ? await liveTurn(text) : await runMock(text);
    hideThinking();
    if (reply) renderMessage('ai', reply);
    cards.forEach(renderCard);
  } catch (err) {
    hideThinking();
    console.error(err);
    renderMessage('system', 'The assistant is unavailable. ' + (err.message || ''));
    renderCard({ kind:'escalate', reason:'assistant_error',
      summary:'The AI assistant errored out. Customer has not been helped yet.',
      payload: buildNccContext('assistant_error', 'AI assistant failed; customer needs a human.', 'normal') });
  }

  busy = false;
  renderQuickies();
  refreshDebug();
}

document.getElementById('composer').addEventListener('submit', e => {
  e.preventDefault();
  send(document.getElementById('input').value);
});

/* ===========================================================================
   DEBUG PANEL  (?debug=1)
   =========================================================================== */

let dbgTab = 'ctx';

function refreshDebug() {
  if (!CONFIG.debug) return;
  const out = document.getElementById('dbgOut');
  if (dbgTab === 'ctx') {
    const ctx = state.lastPayload ||
      buildNccContext('(not escalated yet)', 'Preview only - no escalation has happened.', 'normal');
    const url = nccSurveyUrl(ctx);
    const keys = Object.keys(ctx).map(k => '  ${workitem.data?.' + k + '}').join('\n');
    out.textContent =
      '// context object handed to NCC\n' + JSON.stringify(ctx, null, 2) +
      '\n\n// survey expressions - paste these into the NCC survey builder\n' + keys +
      '\n\n// resulting iframe URL (' + url.length + ' chars)\n' + url;
    const size = document.getElementById('dbgSize');
    size.textContent = url.length + ' chars';
    size.classList.toggle('warn', url.length > 2000);
  } else if (dbgTab === 'tools') {
    out.textContent = state.toolLog.length
      ? state.toolLog.map(t => t.name + '(' + JSON.stringify(t.input) + ')\n  -> ' + JSON.stringify(t.result)).join('\n\n')
      : 'No tool calls yet.';
  } else {
    out.textContent = state.transcript.map(m => m.role.toUpperCase() + ': ' + m.text).join('\n\n') || 'Empty.';
  }
}

document.querySelector('#debug .dbg-tabs').addEventListener('click', e => {
  const b = e.target.closest('button[data-d]');
  if (!b) return;
  if (b.dataset.d === 'close') { document.getElementById('debug').classList.remove('on'); return; }
  dbgTab = b.dataset.d;
  document.querySelectorAll('#debug .dbg-tabs button[data-d]').forEach(x => x.classList.remove('active'));
  b.classList.add('active');
  refreshDebug();
});

document.getElementById('dbgToggle').addEventListener('click', () => {
  const open = document.getElementById('debug').classList.toggle('on');
  document.body.classList.toggle('debug-open', open);
  refreshDebug();
});

/* ===========================================================================
   BOOT
   =========================================================================== */

renderFlightStrip();
renderMap();
renderStatus();
renderQuickies();

if (CONFIG.debug) {
  document.getElementById('dbgToggle').classList.add('on');
  document.getElementById('debug').classList.add('on');
  document.body.classList.add('debug-open');
  refreshDebug();
}

renderMessage('ai',
  'Hi ' + BOOKING.name.split(' ')[0] + ' — I can see your booking for ' + BOOKING.flight + ' to ' +
  BOOKING.destination + '. You’re currently in ' + state.assignedSeat +
  '. I can change your seat, quote an upgrade, or answer questions about the flight.');

if (CONFIG.aiMode === 'live' && !CONFIG.proxyUrl) {
  renderMessage('system', 'ai=live was requested but no &proxy= URL was supplied — running in mock mode.');
}
</script>
